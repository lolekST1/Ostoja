# Wystawianie gry do testów na GitHub Pages.
#
# Odpala się przy każdym wejściu na main, więc po każdym scaleniu dziecko dostaje
# aktualną wersję pod tym samym adresem. Nic nie trzeba klikać poza jednorazowym
# ustawieniem w Settings -> Pages -> Source: GitHub Actions.

# Zanim to zadziała po raz pierwszy, trzeba raz włączyć Pages w repozytorium:
# Settings -> Pages -> Source: GitHub Actions. Token workflow nie ma prawa
# zrobić tego sam. Od tej chwili każde scalenie do main wystawia grę samo.

name: Wystaw grę

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wystawianie naraz. Nowsze czeka, zamiast wyścigu ze starszym.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  buduj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Te same sprawdzenia co lokalnie. Gra ma nie wyjechać do dziecka
      # z niedziałającą mapą albo panelem, który kłamie.
      - name: Kontrola typów
        run: npm run typecheck

      - name: Mapa
        run: npm run mapa -- 1234

      - name: Zapis i odczyt
        run: npm run zapis -- 1234

      # Kampania: czy dane pięciu miejsc trzymają się kupy i co się przenosi
      # między mapami. Zwykły test, wolno mu blokować wystawienie.
      - name: Kraina
        run: npm run kraina

      # `bilans.ts` **nie blokuje wystawienia** i to jest decyzja, nie
      # niedopatrzenie. To narzędzie balansujące, nie test poprawności: mierzy,
      # czy panel „gdzie się korkuje" obiecuje graczowi to samo, co potem robi
      # tick. Rozjazd rzędu 0.09 drewna na dzień jest znanym, opisanym długiem
      # (patrz „Co zostało" w CLAUDE.md, punkt 2) i nie psuje gry — a wstrzymanie
      # z tego powodu wystawienia znaczy, że dziecko nie dostaje działającej
      # gry, bo tabelka w panelu myli się o dziewięć setnych.
      #
      # Wynik zostaje widoczny w logu i krok świeci na żółto, dopóki dług stoi.
      # Gdy się go domknie, wystarczy skasować tę jedną linię.
      - name: Czy panel nie kłamie (znany dług — nie blokuje)
        run: npm run bilans -- 3 1234
        continue-on-error: true

      - name: Budowa
        run: npm run build
        env:
          # Pages serwuje z podkatalogu /Ostoja/, nie z korzenia domeny.
          GITHUB_PAGES: "1"

      # Bez `enablement: true` — token workflow nie ma prawa utworzyć witryny
      # Pages („Resource not accessible by integration"), więc próba tylko
      # wywalała cały przebieg. Pages trzeba raz włączyć ręcznie:
      # Settings -> Pages -> Source: GitHub Actions. Potem to już działa samo.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  wystaw:
    needs: buduj
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.wystawienie.outputs.page_url }}
    steps:
      - id: wystawienie
        uses: actions/deploy-pages@v4
